<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
		<title>Interactive To Do List App</title>
	</head>
	<body>
		<section class="container">
			<article class="header">
				<div class="search-bar">
					<i class="fas fa-search"></i>
					<input type="text" placeholder="Search for any training you want... " />
				</div>
				<div class="header-icons">
					<button class="icon-btn">
						<i class="fas fa-bell"></i><span class="notification-dot">.</span>
					</button>
					<button class="icon-btn"><i class="fas fa-user"></i></button>
				</div>
			</article>
			<article class="main-content">
				<div class="tile-section">
					<div class="greeting" id="greeting"></div>
					<h1 class="titie">
						You have got <span class="task-count" id="taskCount">0</span> Task today...
						<button class="add-btn" onclick="openModal()">
							<i class="fas fa-plus"></i> Add New Task
						</button>
					</h1>
				</div>
				<div class="section">
					<div class="section-header"><h2>On Hold</h2></div>
					<div id="onHoldTask"></div>
				</div>
				<div class="section">
					<div class="section-header">
						<h2>Completed</h2>
						<span class="badge badge-inactive">Inactive</span>
					</div>
                    <div id="completedTasks"></div>
				</div>
			</article>
			<article class="sidebar">
				<div class="sidebar-section">
					<div class="sidebar-title">Results Summary</div>
					<div class="stat-card">
						<div class="stat-label">Completion Rate</div>
						<div class="stat-value" id="completionRateValue">0%</div>
						<div class="progress-bar">
							<div class="progress-fill" id="completionProgress" style="width: 0%;" ></div>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-label">Total Tasks</div>
						<div class="stat-value" id="totalTasks">0</div>
						<div class="progress-bar">
							<div class="progress-fill" id="totalProgress" style="width: 0%;" ></div>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-label">Completed</div>
						<div class="stat-value" id="completedCount">0</div>
					</div>
					<div class="stat-card">
						<div class="stat-label">Pending</div>
						<div class="stat-value" id="pendingCount">0</div>
					</div>
				</div>
			</article>
			<article class="modal" id="taskModal">
				<div class="modal-content">
					<h2 class="modal-header">Add / Update</h2>
					<form  id="taskForm" autocomplete="off">
						<div class="form-group">
							<label>Task Title</label>
							<input type="text" id="taskTitle" placeholder=" Enter Task title here ..." required>
							<label>Status</label>
							<select id="taskStatus">
								<option value="pending">Pending</option>
								<option value="progress">In Progress</option>
								<option value="completed">Completed</option>
							</select>
						</div>
						<div class="form-group">
							<label>Priority</label>
							<select id="taskPriority">
								<option value="minor">Minor</option>
								<option value="normal">Normal</option>
								<option value="critical">Critical</option>
							</select>
						</div>
						<div class="modal-actions">
							<button title="click to cancel" type="button" class="btn btn-secondary" onclick="closeModal()" >Cancel</button>
							<button title="click to save" type="submit" class="btn btn-primary">Save Task</button>
						</div>
					</form>
				</div>
			</article>
		</section>

		<script src="./script.js"></script>
	</body>
</html>
